{% extends "base.html" %}
{% block title %}Resource Not Found (404) | Phishield{% endblock %}
{% block content %}
<div style="padding-top: 8rem; padding-bottom: 6rem; text-align: center;">
<div class="wrap" style="max-width: 520px;">

    <div style="width: 80px; height: 80px; background: var(--paper-2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; border: 1px solid var(--line-2);">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
    </div>

    <p class="eyebrow" style="justify-content: center; margin-bottom: 0.75rem;"><span>HTTP 404</span></p>
    <h2 style="font-size: clamp(1.8rem,4vw,2.8rem); font-weight: 700; letter-spacing: -0.04em; margin: 0 0 1rem; line-height: 1.15;">Resource Not Found</h2>
    <p style="color: var(--ink-3); margin: 0 0 2.5rem; font-size: 1rem; line-height: 1.7;">
        The requested resource does not exist on this Phishield server. It may have been moved or deleted.
    </p>

    <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
        <a href="{{ url_for('main.index') }}" class="btn btn--primary">Back to Home</a>
        <a href="{{ url_for('main.scan') }}" class="btn btn--ghost">Inspect a Link</a>
    </div>

</div>
</div>
{% endblock %}
