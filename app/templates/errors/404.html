{% extends "base.html" %}
{% block title %}Resource Not Found (404) | Phishield{% endblock %}
{% block content %}
<section style="max-width: 580px; margin: 4rem auto; text-align: center;">
    <article style="box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07);">
        <header>
            <span class="rule-badge clear">HTTP 404</span>
            <!-- test-anchor: Resource Not Found -->
            <h2 style="font-size: 1.75rem; font-weight: 800; margin: 0.5rem 0 0.25rem;">Resource Not Found</h2>
        </header>

        <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin: 1rem 0 1.5rem;">
            The requested web resource does not exist on this Phishield server. It may have been relocated or removed.
        </p>

        <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
            <a href="{{ url_for('main.index') }}" role="button">Back to Home</a>
            <a href="{{ url_for('main.scan') }}" role="button" class="contrast outline">Inspect a Link</a>
        </div>
    </article>
</section>
{% endblock %}
